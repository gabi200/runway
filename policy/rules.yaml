tiers:
  T0: [get_balances, list_transactions, list_receivables, list_payables, flag_document, list_documents, withdraw_request]  # withdraw only lowers risk, so it works under the kill switch
  T1: [get_financing_need, get_forecast, run_scenario, compare_financing, draft_email, explain_figure, make_chart]
  T2: [send_payment_reminder, schedule_payment]
  T3: [reschedule_payment, prepare_financing_application]
  T4: [add_payee, update_payee, change_limits, export_data, set_kill_switch]
payment:
  max_payment_cents: 100000000
  approval_tier: T3
  automatic_amount_cents: 100000
  automatic_requires_invoice: true   # payments without an open AP invoice always need the owner
  daily_payee_cents: 100000
  daily_global_cents: 300000
  weekly_global_cents: 500000      # rolling 7 simulated days: advancing the clock does not reset it
  accountant_above_cents: 500000
  owner_roles: [owner]
  material_roles: [owner, accountant]
approvals:
  expiry_days: 7   # a request pending longer (simulated days) expires; the agent must ask again
reminder:
  daily_limit: 10
  interval_days: 7
financing:
  min_days_needed: 1
  max_days_needed: 365
  max_needed_by_days: 120
