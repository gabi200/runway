[project]
name = "runway"
version = "0.1.0"
description = "Runway: an AI finance officer for small suppliers that acts under strict, visible limits."
requires-python = ">=3.11"
license = "LicenseRef-Runway"
license-files = ["LICENSE"]
authors = [
    { name = "Voicu Delia-Andreea" },
    { name = "Georgescu Gabriel" },
    { name = "Tomescu Vlad-Costin" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    "streamlit>=1.65",
    "reportlab>=4.2",
    "pypdf>=4.3",
    "pandas>=2.2",
    "eth-account>=0.13",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["common", "data", "bank", "forecast", "policy", "agent", "llm", "audit", "ui", "redteam"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
